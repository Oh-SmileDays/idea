<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>설명 영상</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#0f1226;font-family:"WenQuanYi Zen Hei","Noto Sans KR",sans-serif;color:#fff}
.scene{position:absolute;inset:0;display:grid;place-items:center;opacity:0}
.bgdot{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45}
.stage{position:relative;width:1100px;height:520px}
.h{position:absolute;left:0;right:0;top:0;text-align:center;font-size:58px;font-weight:700;line-height:1.25}
.sub{position:absolute;left:0;right:0;bottom:-10px;text-align:center;font-size:30px;color:#c7cbff;background:rgba(0,0,0,.35);padding:12px 20px;border-radius:12px}
.card{position:absolute;background:#fff;color:#1b1f2a;border-radius:18px;padding:16px 22px;font-size:28px;box-shadow:0 12px 30px rgba(0,0,0,.35);white-space:nowrap}
.chk{display:inline-block;width:30px;height:30px;border:3px solid #4f46e5;border-radius:8px;margin-right:14px;vertical-align:-6px;position:relative}
.chk.on{background:#16a34a;border-color:#16a34a}
.chk.on:after{content:"";position:absolute;left:8px;top:2px;width:8px;height:16px;border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg)}
.bot{position:absolute;width:120px;height:120px;border-radius:50%;background:#6366f1;display:grid;place-items:center;font-size:62px}
.prog{position:absolute;height:26px;border-radius:99px;background:#272b4d;overflow:hidden}.prog i{display:block;height:100%;background:#4ade80}
.big{position:absolute;font-size:150px;font-weight:700;text-align:center;width:100%}
.progress{position:absolute;left:0;bottom:0;height:6px;background:#818cf8}
</style></head><body>
<div class="bgdot" style="width:520px;height:520px;background:#4f46e5;left:-120px;top:-160px"></div>
<div class="bgdot" style="width:460px;height:460px;background:#0ea5e9;right:-100px;bottom:-180px"></div>
<div id="root"></div><div class="progress" id="pg"></div>
<script>
const FPS=24, DUR=30, W=1280;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};
const root=document.getElementById('root');

// 장면 6개 × 5초. 각 장면은 s(0~5초)로 자기 요소를 그린다.
const scenes=[
 {h:'오늘 할 일, 몇 개나 있나요?',sub:'머릿속에만 있는 할 일은 하루를 흔들어요.',
  build:st=>{for(let i=0;i<9;i++)st.append(el(`<div class="card" data-i="${i}">${['메일 답장','보고서','장보기','운동','전화','정산','공부','청소','예약'][i]}</div>`))},
  tick:(st,s)=>st.querySelectorAll('.card').forEach(c=>{const i=+c.dataset.i,k=back((s-i*.25)/.6);
    c.style.left=(70+(i%3)*330)+'px';c.style.top=(150+Math.floor(i/3)*100+Math.sin(s*2+i)*6)+'px';c.style.opacity=clamp(k);c.style.transform=`scale(${.6+.4*k}) rotate(${(i%3-1)*3}deg)`})},
 {h:'정답은 "꼭" 3가지만',sub:'전부 하려 하지 말고, 오늘의 핵심만 고르세요.',
  build:st=>{st.append(el('<div class="big" style="top:130px;color:#a5b4fc" id="n"></div>'))
    ;['①','②','③'].forEach((n,i)=>st.append(el(`<div class="card" data-i="${i}" style="left:${60+i*350}px;top:330px;font-size:30px">${n} 핵심 할 일 ${i+1}</div>`)))},
  tick:(st,s)=>{const n=st.querySelector('#n');n.textContent=Math.round(9-6*ease(s/1.5));n.style.opacity=1;
    st.querySelectorAll('.card').forEach(c=>{const k=back((s-1.5-c.dataset.i*.4)/.6);c.style.opacity=clamp(k);c.style.transform=`translateY(${(1-clamp(k))*40}px)`})}},
 {h:'체크 목록으로 눈에 보이게',sub:'끝낼 때마다 ✔ 하나, 진행률이 올라가요.',
  build:st=>{['보고서 초안 쓰기','팀장님께 메일 보내기','운동 30분'].forEach((t,i)=>st.append(el(`<div class="card" data-i="${i}" style="left:230px;top:${150+i*95}px;width:640px"><span class="chk"></span>${t}</div>`)))
    ;st.append(el('<div class="prog" style="left:230px;top:420px;width:640px"><i id="f"></i></div>'))},
  tick:(st,s)=>{let done=0;st.querySelectorAll('.card').forEach((c,i)=>{c.style.opacity=clamp(ease((s-i*.2)/.5));const on=s>1.6+i*1.1;if(on)done++;c.querySelector('.chk').classList.toggle('on',on);c.style.transform=on?'scale(1.03)':''})
    ;st.querySelector('#f').style.width=(done/3*100)+'%'}},
 {h:'그리고 "살아있는 비서"',sub:'시간을 보고, 마감을 챙기고, 먼저 말을 걸어요.',
  build:st=>{st.append(el('<div class="bot" id="b" style="left:120px;top:190px">🤖</div>'));
    st.append(el('<div class="card" id="m1" style="left:290px;top:150px;font-size:30px">⏰ "보고서" 마감까지 20분 남았어요</div>'));
    st.append(el('<div class="card" id="m2" style="left:290px;top:260px;font-size:30px">지금 5분만 시작해볼까요?</div>'));
    st.append(el('<div class="card" id="m3" style="left:290px;top:370px;font-size:30px;background:#dcfce7">🎉 오늘 꼭 할 일 완료!</div>'))},
  tick:(st,s)=>{st.querySelector('#b').style.transform=`scale(${1+.06*Math.sin(s*4)})`;
    ['m1','m2','m3'].forEach((id,i)=>{const k=back((s-.6-i*1.2)/.5);const e=st.querySelector('#'+id);e.style.opacity=clamp(k);e.style.transform=`translateX(${(1-clamp(k))*-60}px)`})}},
 {h:'하루가 끝나면',sub:'못 끝낸 일은 내일로 자동 이월돼요.',
  build:st=>{st.append(el('<div class="big" id="p" style="top:120px;color:#4ade80"></div>'));
    st.append(el('<div class="prog" style="left:150px;top:350px;width:800px;height:34px"><i id="f"></i></div>'));
    st.append(el('<div class="card" id="c" style="left:380px;top:420px">↪ 운동 30분 (내일로 이월)</div>'))},
  tick:(st,s)=>{const k=ease(s/2);st.querySelector('#p').textContent=Math.round(67*k)+'%';st.querySelector('#f').style.width=(67*k)+'%';
    st.querySelector('#c').style.opacity=clamp(ease((s-2.2)/.6))}},
 {h:'지금 시작해요',sub:'오늘 꼭 할 일 3가지부터 적어보세요.',
  build:st=>{st.append(el('<div class="big" id="e" style="top:150px;font-size:120px">🤖✅</div>'));
    st.append(el('<div class="card" id="t" style="left:310px;top:340px;font-size:40px">살아있는 비서</div>'))},
  tick:(st,s)=>{const k=back(s/.8);st.querySelector('#e').style.transform=`scale(${.5+.5*clamp(k)})`;st.querySelector('#e').style.opacity=clamp(k);st.querySelector('#t').style.opacity=clamp(ease((s-.6)/.5))}},
];
const SD=DUR/scenes.length;
const nodes=scenes.map(sc=>{
  const sceneEl=el(`<div class="scene"><div class="stage"><div class="h">${sc.h}</div><div class="sub">${sc.sub}</div></div></div>`);
  const st=sceneEl.firstElementChild;sc.build(st);root.append(sceneEl);return sceneEl});

window.DURATION=DUR;window.FPS=FPS;
window.setT=t=>{
  const idx=Math.min(scenes.length-1,Math.floor(t/SD)), s=t-idx*SD;
  nodes.forEach((n,i)=>{
    n.style.opacity=i===idx?String(Math.min(ease(s/.4),clamp((SD-s)/.4))):'0';
  });
  const st=nodes[idx].firstElementChild;
  const h=st.querySelector('.h');h.style.transform=`translateY(${(1-ease(s/.5))*-30}px)`;
  scenes[idx].tick(st,s);
  document.getElementById('pg').style.width=(t/DUR*W)+'px';
};
setT(0);
</script></body></html>
